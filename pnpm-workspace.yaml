  '@prisma/config>deepmerge-ts': 8.0.0
  'prisma>mysql2': 3.23.1
  'lodash@<4.18.1': 4.18.1
  'fast-uri@>=3.0.0 <4.0.0': 3.1.8
  'fast-uri@>=4.0.0 <4.1.5': 4.1.5
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
  'smol-toml@>=1.0.0 <1.9.0': 1.9.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
