services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    exclude_from_hc: true
    image: "${COOLIFY_RESOURCE_UUID:-astro-telekom}-api:migration"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "apps/api/node_modules/prisma/build/index.js", "migrate", "deploy", "--config", "prisma.config.ts"]

  api:
    image: "${COOLIFY_RESOURCE_UUID:-astro-telekom}-api:runtime"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      TRUST_PROXY: "true"
      REBUILD_PROVIDER: "static"
      STATIC_PUBLICATION_URL: http://web:8081
      SERVING_CATALOG_PROJECTIONS_ENABLED: ${SERVING_CATALOG_PROJECTIONS_ENABLED:-false}
      PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in Coolify}
      EDITORIAL_MEDIA_ROOT: /editorial-media
    volumes:
      - editorial_media:/editorial-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      REBUILD_PROVIDER: "static"
      STATIC_PUBLICATION_URL: http://web:8081
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "services/worker/src/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  serving-projection-warmer:
    exclude_from_hc: true
    image: "${COOLIFY_RESOURCE_UUID:-astro-telekom}-api:runtime"
    pull_policy: never
    restart: "on-failure:5"
    init: true
    cpus: 0.5
    mem_limit: 512m
    env_file: ${ENV_FILE:-.env}
    environment:
      REBUILD_PROVIDER: "static"
      STATIC_PUBLICATION_URL: http://web:8081
      SERVING_CATALOG_PROJECTION_WARMER_ENABLED: ${SERVING_CATALOG_PROJECTION_WARMER_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "apps/api/dist/serving-projection-warmer-main.js"]

  bootstrap-seed:
    exclude_from_hc: true
    image: "${COOLIFY_RESOURCE_UUID:-astro-telekom}-api:runtime"
    pull_policy: never
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    environment:
      RUN_BOOTSTRAP_SEED: ${RUN_BOOTSTRAP_SEED:?Set true for the first deploy and false afterwards}
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        case "$$RUN_BOOTSTRAP_SEED" in
          true) node /workspace/apps/api/dist/seed.js ;;
          false) echo "Initial seed explicitly skipped" ;;
          *) echo "RUN_BOOTSTRAP_SEED must be true or false" >&2; exit 1 ;;
        esac

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: publication-runtime
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      API_UPSTREAM: api:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in Coolify}
      SITE_DATA_API_URL: http://api:3000/api/v1
      PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in Coolify}/api/v1
      PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in Coolify}
      PUBLIC_SITE_SLUG: ${PUBLIC_SITE_SLUG:-domru-site}
      PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID:-}
      PUBLIC_CONNECTION_PHONE: ${PUBLIC_CONNECTION_PHONE:-}
      PUBLIC_SUPPORT_PHONE: ${PUBLIC_SUPPORT_PHONE:-}
      PUBLIC_TEST_MODE: "true"
      EDITORIAL_MEDIA_ROOT: /editorial-media
      COOLIFY_API_URL: ${COOLIFY_API_URL:?Set COOLIFY_API_URL in Coolify}
      COOLIFY_RESOURCE_UUID: ${COOLIFY_RESOURCE_UUID:?Set COOLIFY_RESOURCE_UUID in Coolify}
    expose:
      - "80"
    volumes:
      - web_publication:/publication
      - editorial_media:/editorial-media:ro
    depends_on:
      bootstrap-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1/'), fetch('http://127.0.0.1:8081/active', {headers:{'x-admin-token':process.env.ADMIN_API_TOKEN}})]).then(rs => process.exit(rs.every(r => r.ok) ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.http.middlewares.public-security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.public-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.public-security-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.public-security-headers.headers.permissionspolicy=camera=(), geolocation=(), microphone=(), payment=(), usb=()"
      - "traefik.http.middlewares.public-security-headers.headers.contentsecuritypolicy=frame-ancestors 'self' https://metrika.yandex.ru https://analytics.yandex.by https://analytics.yandex.com https://analytics.yandex.com.tr https://analytics.yandex.kz https://analytics.yandex.ru https://metr.yandex.by https://metr.yandex.com https://metr.yandex.com.tr https://metr.yandex.kz https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex https://metrica.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex.ru https://metrika.ya.ru https://metrika.yandex https://metrika.yandex.by https://metrika.yandex.com https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz;"
      - "traefik.http.middlewares.public-security-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.test-basic-auth.basicauth.users=${TEST_BASIC_AUTH_USERS:?Set TEST_BASIC_AUTH_USERS in Coolify}"
      - "coolify.traefik.middlewares=public-security-headers,test-basic-auth"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        PUBLIC_API_URL: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in Coolify}/api/v1
        PUBLIC_PROVIDER_ID: ${PUBLIC_PROVIDER_ID:-}
        PUBLIC_SITE_ID: ${PUBLIC_SITE_ID:-}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3000
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.http.middlewares.admin-security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.admin-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.admin-security-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.admin-security-headers.headers.permissionspolicy=camera=(), geolocation=(), microphone=(), payment=(), usb=()"
      - "traefik.http.middlewares.admin-security-headers.headers.contentsecuritypolicy=frame-ancestors 'none';"
      - "traefik.http.middlewares.admin-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.admin-security-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive"
      - "traefik.http.middlewares.test-basic-auth.basicauth.users=${TEST_BASIC_AUTH_USERS:?Set TEST_BASIC_AUTH_USERS in Coolify}"
      - "coolify.traefik.middlewares=admin-security-headers,test-basic-auth"

volumes:
  editorial_media:
  postgres_data:
  redis_data:
  web_publication:
