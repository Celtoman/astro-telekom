services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "apps/api/node_modules/prisma/build/index.js", "migrate", "deploy", "--config", "prisma.config.ts"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        SITE_DATA_API_URL: ${SITE_DATA_API_URL}
        PUBLIC_PROVIDER_ID: ${PUBLIC_PROVIDER_ID:-}
        PUBLIC_SITE_ID: ${PUBLIC_SITE_ID:-}
        PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
        PUBLIC_SITE_SLUG: ${PUBLIC_SITE_SLUG:-domru-site}
        PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID:-}
        PUBLIC_CONNECTION_PHONE: ${PUBLIC_CONNECTION_PHONE:-}
        PUBLIC_SUPPORT_PHONE: ${PUBLIC_SUPPORT_PHONE:-}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3000
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        PUBLIC_PROVIDER_ID: ${PUBLIC_PROVIDER_ID:-}
        PUBLIC_SITE_ID: ${PUBLIC_SITE_ID:-}
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
