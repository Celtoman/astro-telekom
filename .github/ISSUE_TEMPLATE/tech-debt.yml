name: Технический долг / найденная проблема
description: Проблема, подтверждённая кодом, конфигурацией или воспроизводимой проверкой (баг, риск, недоделка).
title: "TD-XX: "
labels: ["tech-debt"]
body:
  - type: markdown
    attributes:
      value: |
        Перед созданием: если это правка уже описанного TD-пункта — допиши issue, а не создавай новый. Полный реестр — [docs/technical-debt.md](../../docs/technical-debt.md).
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      description: Шкала из docs/technical-debt.md
      options:
        - "P0 — блокирует безопасный запуск или ведёт к недостоверным данным"
        - "P1 — нарушает ключевой путь первого релиза"
        - "P2 — существенно ограничивает эксплуатацию"
        - "P3 — улучшение качества и поддерживаемости"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Проблема и доказательство
      description: Что не так, со ссылкой на файл/строку/команду, которой подтверждено.
      placeholder: "apps/api/src/...: ..."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Влияние
      description: К чему это приводит на практике.
    validations:
      required: true
  - type: textarea
    id: next-action
    attributes:
      label: Следующее действие
      description: Конкретный первый шаг к исправлению — не "разобраться", а что именно сделать.
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Связано
      description: TD-ID в docs/technical-debt.md (если уже есть), номера связанных issue, ссылки на decisions.md/design-system.
      placeholder: "docs/technical-debt.md, TD-22"
