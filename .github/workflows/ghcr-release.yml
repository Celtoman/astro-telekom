name: Build exact astro-telekom release images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full master commit SHA with a successful push CI
        required: true
        type: string

permissions: {}

concurrency:
  group: ghcr-production-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  verify-source:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verified.outputs.sha }}
      tree: ${{ steps.verified.outputs.tree }}
    steps:
      - name: Verify the source and its completed master CI
        id: verified
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master \
            --commit "$SOURCE_SHA" --event push --limit 1 --json headSha,conclusion,status |
            jq -e --arg sha "$SOURCE_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")'
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$SOURCE_SHA" "$tree" >> "$GITHUB_OUTPUT"

  build-images:
    needs: verify-source
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [migration, api, worker, web, admin]
    env:
      IMAGE_ROLE: ${{ matrix.role }}
      SOURCE_SHA: ${{ needs.verify-source.outputs.sha }}
      SOURCE_TREE: ${{ needs.verify-source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-source.outputs.sha }}
          persist-credentials: false
      - name: Build the verified SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          target=()
          args=()
          case "$IMAGE_ROLE" in
            migration) dockerfile=apps/api/Dockerfile; target=(--target migration) ;;
            api) dockerfile=apps/api/Dockerfile; target=(--target runtime) ;;
            worker) dockerfile=services/worker/Dockerfile ;;
            web) dockerfile=apps/web/Dockerfile; target=(--target publication-runtime) ;;
            admin) dockerfile=apps/admin/Dockerfile; args=(--build-arg PUBLIC_API_URL=https://admin.tv-internet-dom.ru/api/v1 --build-arg PUBLIC_PROVIDER_ID= --build-arg PUBLIC_SITE_ID=) ;;
            *) exit 1 ;;
          esac
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --file "$dockerfile" \
            "${target[@]}" "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "astro-telekom-release:$IMAGE_ROLE" \
            --output "type=docker,dest=$RUNNER_TEMP/image.tar" .
      - name: Encrypt the image archive for the publishing environment
        shell: bash
        env:
          ENCRYPTION_CERT: ${{ vars.GHCR_ARTIFACT_ENCRYPTION_CERT }}
        run: |
          set -euo pipefail
          : "${ENCRYPTION_CERT:?Configure GHCR_ARTIFACT_ENCRYPTION_CERT}"
          cert_file=$(mktemp)
          trap 'rm -f -- "$cert_file"' EXIT
          printf '%s\n' "$ENCRYPTION_CERT" > "$cert_file"
          openssl cms -encrypt -aes-256-gcm -binary -stream -outform DER \
            -in "$RUNNER_TEMP/image.tar" -out "$RUNNER_TEMP/image.tar.cms" \
            -recip "$cert_file"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ matrix.role }}
          path: ${{ runner.temp }}/image.tar.cms
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  publish-images:
    needs: [verify-source, build-images]
    environment: ghcr-release
    permissions:
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [migration, api, worker, web, admin]
    env:
      IMAGE_ROLE: ${{ matrix.role }}
      SOURCE_SHA: ${{ needs.verify-source.outputs.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-${{ matrix.role }}
          path: ${{ runner.temp }}/release-image
      - name: Decrypt the image archive
        shell: bash
        env:
          DECRYPTION_KEY: ${{ secrets.GHCR_ARTIFACT_DECRYPTION_KEY }}
        run: |
          set -euo pipefail
          : "${DECRYPTION_KEY:?Configure the ghcr-release environment secret}"
          key_file=$(mktemp)
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$DECRYPTION_KEY" > "$key_file"
          openssl cms -decrypt -binary -inform DER -inkey "$key_file" \
            -in "$RUNNER_TEMP/release-image/image.tar.cms" -out "$RUNNER_TEMP/image.tar"
      - name: Load and verify the image
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image.tar"
          image="astro-telekom-release:$IMAGE_ROLE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_SHA"
      - name: Publish the image and read back its digest
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-release-$IMAGE_ROLE"
          image="$repo:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${SOURCE_SHA:0:8}"
          docker tag "astro-telekom-release:$IMAGE_ROLE" "$image"
          docker push "$image"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/image-identity"
          jq -n --arg role "$IMAGE_ROLE" --arg source "$SOURCE_SHA" --arg image "$repo@$digest" \
            '{role:$role,sourceSha:$source,image:$image}' > "$RUNNER_TEMP/image-identity/identity.json"
          cat "$RUNNER_TEMP/image-identity/identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity-${{ matrix.role }}
          path: ${{ runner.temp }}/image-identity/identity.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
